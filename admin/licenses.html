<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXOHUB License Center</title><style>
:root{color-scheme:dark;--bg:#08090f;--panel:#11131c;--line:#24283a;--text:#f4f6ff;--muted:#9ca3b8;--accent:#8b5cf6;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#171028 0,#08090f 44%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.brand{font-weight:900;font-size:26px}.sub{color:var(--muted);margin-top:6px}.panel{background:rgba(17,19,28,.88);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.2);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:15px;background:#0d0f17;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:22px;margin-top:5px}.form{display:grid;grid-template-columns:1.3fr .8fr .6fr auto;gap:10px}.input,select,button{height:44px;border-radius:10px;border:1px solid var(--line);background:#0c0e15;color:var(--text);padding:0 13px}.btn{background:linear-gradient(135deg,#8b5cf6,#6d3df0);border:0;font-weight:800;cursor:pointer}.btn.secondary{background:#171a25}.table{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:2.1fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0;background:#0d0f17;color:var(--muted);font-size:12px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;background:#1b1e2a}.active{color:#86efac;background:rgba(34,197,94,.12)}.unused{color:#c4b5fd;background:rgba(139,92,246,.13)}.expired,.revoked{color:#fca5a5;background:rgba(239,68,68,.12)}.actions{display:flex;gap:6px}.actions button{height:34px;font-size:12px;cursor:pointer}.keys{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#ddd}.hint{color:var(--muted);font-size:12px;margin-top:9px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row:first-child{display:none}}@media(max-width:560px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">VEXOHUB · License Center</div><div class="sub">기간제 라이선스 발급 · 최초 1회 활성화 · 봇/사용자/서버 귀속</div></div><button class="btn secondary" onclick="loadLicenses()">새로고침</button></div>
<section class="grid"><div class="stat">전체 라이선스<b id="total">0</b></div><div class="stat">미사용<b id="unused">0</b></div><div class="stat">활성<b id="active">0</b></div><div class="stat">만료/취소<b id="closed">0</b></div></section>
<section class="panel"><h3>새 라이선스 발급</h3><div class="form"><select id="tier"><option>BASIC</option><option>BASIC PREMIUM</option><option>PRO</option><option>PRO PREMIUM</option></select><select id="days"><option value="7">7일</option><option value="30" selected>30일</option><option value="90">90일</option><option value="0">영구</option></select><input id="count" class="input" type="number" min="1" max="100" value="1"><button class="btn" onclick="issue()">발급</button></div><div class="hint">발급된 키는 생성 순간에만 전체 문자열을 확인할 수 있습니다.</div><pre id="issued" class="keys"></pre></section>
<section class="panel"><h3>라이선스 목록</h3><div class="table" id="table"><div class="row"><div>등급 / 라이선스 ID</div><div>기간</div><div>상태</div><div>활성화</div><div>만료</div><div>관리</div></div></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function loadLicenses(){const r=await fetch('/api/admin/licenses'); if(!r.ok){alert('관리자 로그인이 필요합니다.');return} const d=await r.json(); const arr=d.licenses||[]; total.textContent=arr.length; unused.textContent=arr.filter(x=>x.status==='unused').length; active.textContent=arr.filter(x=>x.status==='active').length; closed.textContent=arr.filter(x=>['expired','revoked'].includes(x.status)).length; table.innerHTML='<div class="row"><div>등급 / 라이선스 ID</div><div>기간</div><div>상태</div><div>활성화</div><div>만료</div><div>관리</div></div>'+arr.map(x=>`<div class="row"><div><b>${esc(x.tier)}</b><br><span class="keys">${esc(x.id)}</span></div><div>${esc(x.durationLabel)}</div><div><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div><div>${x.activationCount||0}</div><div>${x.expiresAt?esc(new Date(x.expiresAt).toLocaleString('ko-KR')):'영구'}</div><div class="actions"><button onclick="extendLic('${esc(x.id)}')">+30일</button><button onclick="revokeLic('${esc(x.id)}')">취소</button></div></div>`).join('')}
async function issue(){const body={tier:tier.value,days:Number(days.value),count:Number(count.value)};const r=await fetch('/api/admin/licenses/issue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(d.error||'발급 실패');return}issued.textContent=(d.licenses||[]).map(x=>`${x.tier} ${x.durationLabel}\n${x.key}`).join('\n\n');loadLicenses()}
async function extendLic(id){const r=await fetch('/api/admin/licenses/'+id+'/extend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:30})});const d=await r.json();if(!r.ok)alert(d.error||'연장 실패');loadLicenses()}
async function revokeLic(id){if(!confirm('이 라이선스를 취소할까요?'))return;const r=await fetch('/api/admin/licenses/'+id+'/revoke',{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error||'취소 실패');loadLicenses()}
loadLicenses();
</script></body></html>
